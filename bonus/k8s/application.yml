apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playground-app-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'http://gitlab-service.gitlab.svc.cluster.local/root/iot-app.git'
    targetRevision: HEAD
    path: .
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true